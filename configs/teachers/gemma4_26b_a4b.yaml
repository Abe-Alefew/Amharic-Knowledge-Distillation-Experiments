# Teacher candidate: Gemma 4 26B MoE (Apache 2.0). VERIFY repo ids on huggingface.co.
name: gemma4_26b_a4b
family: gemma4
hf_repo: google/gemma-4-26B-A4B-it
license: apache-2.0
backend: gguf            # gguf (CPU RAM, quantized) | hf (transformers, needs GPU for 4bit)
gguf:
  path: ""               # local .gguf path, OR set repo+file below
  repo: ""               # HF repo containing a Q4 GGUF of this model (verify it exists)
  file: ""               # e.g. the Q4_K_M .gguf filename
  n_ctx: 4096
  n_gpu_layers: 0        # -1 = offload everything when a GPU is available
hf:
  quant: 4bit            # 4bit | none
chat_template_kwargs: {}
system_prompt: ""
prompt_suffix: ""
strip_think: true
generation:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
